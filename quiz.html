<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:#0a0a0a;--white:#f8f7f4;--cream:#f0ede6;
      --ink:#1a1a1a;--muted:#6b6b6b;--accent:#1a3a5c;
      --accent2:#c8a96e;--border:#e0ddd6;
      --green:#27ae60;--red:#c0392b;
      --serif:'DM Serif Display',serif;
      --sans:'DM Sans',sans-serif;
      --mono:'JetBrains Mono',monospace;
    }
    body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;}
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:1.2rem 4rem;background:rgba(248,247,244,0.95);
      backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    }
    .nav-logo{font-family:var(--serif);font-size:1.4rem;color:var(--accent);text-decoration:none;}
    .nav-logo span{color:var(--accent2);}
    .nav-links{display:flex;gap:2rem;align-items:center;}
    .nav-links a{text-decoration:none;color:var(--muted);font-size:0.875rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;transition:color 0.2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--accent);}
    .nav-cta{background:var(--accent)!important;color:var(--white)!important;padding:0.5rem 1.4rem!important;border-radius:2px!important;font-weight:600!important;}

    .page-header{padding:8rem 4rem 4rem;background:var(--cream);border-bottom:1px solid var(--border);}
    .page-label{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:0.6rem;}
    .page-title{font-family:var(--serif);font-size:clamp(2.2rem,4vw,3.5rem);letter-spacing:-0.02em;}
    .page-sub{font-size:0.95rem;color:var(--muted);margin-top:0.6rem;}

    .quiz-selector{padding:3rem 4rem;border-bottom:1px solid var(--border);}
    .selector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
    .sel-card{
      background:var(--white);border:1.5px solid var(--border);border-radius:4px;
      padding:1.5rem;cursor:pointer;transition:all 0.2s;text-align:left;
    }
    .sel-card:hover,.sel-card.selected{border-color:var(--accent);background:rgba(26,58,92,0.04);}
    .sel-card h4{font-family:var(--serif);font-size:1.05rem;margin-bottom:0.3rem;}
    .sel-card p{font-size:0.78rem;color:var(--muted);}
    .sel-count{font-family:var(--mono);font-size:0.68rem;color:var(--accent2);margin-top:0.6rem;}

    .quiz-area{padding:3rem 4rem 5rem;display:none;}
    .quiz-area.active{display:block;}

    .quiz-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:2rem;flex-wrap:wrap;gap:1rem;
    }
    .quiz-title{font-family:var(--serif);font-size:1.6rem;}
    .quiz-progress-bar{width:100%;background:var(--border);border-radius:2px;height:4px;margin-bottom:2rem;}
    .quiz-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s;}

    .question-card{
      background:var(--cream);border:1px solid var(--border);
      border-radius:6px;padding:2.5rem;margin-bottom:1.5rem;
      max-width:780px;
    }
    .q-num{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:0.8rem;}
    .q-text{font-family:var(--serif);font-size:1.2rem;line-height:1.5;margin-bottom:1.8rem;}
    .q-source{font-family:var(--mono);font-size:0.65rem;color:var(--muted);margin-bottom:1.2rem;letter-spacing:0.06em;}

    .options{display:flex;flex-direction:column;gap:0.75rem;}
    .option-btn{
      background:var(--white);border:1.5px solid var(--border);
      border-radius:4px;padding:1rem 1.2rem;
      text-align:left;font-family:var(--sans);font-size:0.9rem;
      cursor:pointer;transition:all 0.2s;
      display:flex;align-items:center;gap:0.8rem;
    }
    .option-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(26,58,92,0.04);}
    .option-btn.correct{background:rgba(39,174,96,0.08);border-color:var(--green);color:var(--green);}
    .option-btn.wrong{background:rgba(192,57,43,0.08);border-color:var(--red);color:var(--red);}
    .option-btn:disabled{cursor:default;}
    .option-letter{
      width:28px;height:28px;border-radius:50%;
      background:var(--cream);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--mono);font-size:0.75rem;font-weight:600;flex-shrink:0;
    }
    .option-btn.correct .option-letter{background:var(--green);color:white;border-color:var(--green);}
    .option-btn.wrong .option-letter{background:var(--red);color:white;border-color:var(--red);}

    .explanation{
      margin-top:1.2rem;padding:1rem 1.2rem;
      background:rgba(26,58,92,0.05);border-left:3px solid var(--accent);
      border-radius:0 4px 4px 0;font-size:0.875rem;color:var(--ink);
      display:none;line-height:1.65;
    }
    .explanation.show{display:block;}

    .quiz-nav{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:1.5rem;max-width:780px;
    }
    .btn-nav{
      padding:0.75rem 1.8rem;border-radius:3px;
      font-family:var(--sans);font-size:0.875rem;font-weight:600;
      cursor:pointer;transition:all 0.2s;
    }
    .btn-next{background:var(--accent);color:white;border:none;}
    .btn-next:hover{background:var(--accent2);color:var(--ink);}
    .btn-back{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
    .btn-back:hover{border-color:var(--accent);color:var(--accent);}

    .score-screen{
      display:none;text-align:center;padding:4rem 2rem;max-width:500px;margin:0 auto;
    }
    .score-screen.show{display:block;}
    .score-circle{
      width:120px;height:120px;border-radius:50%;
      background:var(--cream);border:3px solid var(--border);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      margin:0 auto 2rem;
    }
    .score-num{font-family:var(--serif);font-size:2.5rem;color:var(--accent);}
    .score-total{font-size:0.75rem;color:var(--muted);}
    .score-screen h2{font-family:var(--serif);font-size:2rem;margin-bottom:0.5rem;}
    .score-screen p{color:var(--muted);margin-bottom:2rem;}
    .score-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}

    @media(max-width:900px){
      nav{padding:1rem 1.5rem;}
      .nav-links{display:none;}
      .page-header,.quiz-selector,.quiz-area{padding-left:1.5rem;padding-right:1.5rem;}
    }
  </style>
</head>

<script>
const QUIZZES = [
  // ── KINEMATICS (existing) ────────────────────────────────
  {
    id: 'kinematics', title: "Kinematics Basics", course: "11",
    desc: "1D & 2D motion, graphs, projectile", count: 5,
    questions: [
      {
        q: "A ball is thrown vertically upward with velocity 20 m/s. How high does it go? (g = 10 m/s²)",
        options: ["10 m", "20 m", "40 m", "5 m"],
        ans: 1,
        src: "",
        explanation: "Using v² = u² − 2gh, at max height v = 0. So h = u²/2g = 400/20 = 20 m."
      },
      {
        q: "The slope of a velocity-time graph gives:",
        options: ["Displacement", "Speed", "Acceleration", "Distance"],
        ans: 2,
        src: "",
        explanation: "Slope of v-t graph = Δv/Δt = acceleration."
      },
      {
        q: "A projectile is launched at 45° for maximum range. If initial speed is u, range R is:",
        options: ["u²/g", "u²/2g", "2u²/g", "u/g"],
        ans: 0,
        src: "",
        explanation: "R = u²sin(2θ)/g. At θ = 45°, sin 90° = 1. So R = u²/g."
      },
      {
        q: "An object moves 4 m East and 3 m North. Its displacement magnitude is:",
        options: ["7 m", "1 m", "5 m", "12 m"],
        ans: 2,
        src: "",
        explanation: "Displacement = √(4² + 3²) = √25 = 5 m."
      },
      {
        q: "If a car decelerates from 20 m/s to rest in 4 seconds, the retardation is:",
        options: ["80 m/s²", "5 m/s²", "4 m/s²", "10 m/s²"],
        ans: 1,
        src: "",
        explanation: "a = (v − u)/t = (0 − 20)/4 = −5 m/s². Retardation = 5 m/s²."
      }
    ]
  },

  // ── TOPIC 1 : DISTANCE, DISPLACEMENT & UNIFORM MOTION ───
  {
    id: 'motion-topic1', title: "Distance, Displacement & Uniform Motion", course: "11",
    desc: "JEE PYQ : Uniform Motion, Displacement, Average Velocity", count: 6,
    questions: [
      {
        q: "A particle is moving with speed v = b√x along the positive x-axis. The speed of the particle at time t = τ (particle is at origin at t = 0) is:",
        options: ["b²τ / 4", "b²τ / 2", "b²τ", "b²τ / √2"],
        ans: 1,
        src: "JEE Main 12 Apr 2019 III",
        explanation: "v = b√x ⟹ dx/√x = b dt. Integrating: 2√x = bt ⟹ x = b²t²/4. Then v = dx/dt = b²t/2. At t = τ, v = b²τ/2."
      },
      {
        q: "In 1.0 s, a particle goes from point A to point B moving in a semicircle of radius 1.0 m. The magnitude of the average velocity is:",
        options: ["3.14 m/s", "2.0 m/s", "1.0 m/s", "Zero"],
        ans: 1,
        src: "JEE 1999S",
        explanation: "Displacement (A to B through semicircle) = diameter = 2r = 2.0 m. Time = 1.0 s. Average velocity = 2.0/1.0 = 2.0 m/s."
      },
      {
        q: "A particle moves in a circle of radius R. In half the period of revolution, its displacement is ___ and distance covered is ___.",
        options: ["2R, πR", "πR, 2R", "R, 2πR", "2πR, R"],
        ans: 0,
        src: "JEE 1983",
        explanation: "In half revolution, the particle moves to the diametrically opposite point — displacement = 2R (diameter). Distance travelled = half circumference = πR."
      },
      {
        q: "A particle is moving eastwards with velocity 5 m/s. In 10 s the velocity changes to 5 m/s northwards. The average acceleration in this time is:",
        options: ["Zero", "1/√2 m/s² towards north-west", "1/√2 m/s² towards north-east", "1/√2 m/s² towards north"],
        ans: 1,
        src: "JEE 1982",
        explanation: "Δv = v_f − v_i = 5 N̂ − 5 Ê. Magnitude = √(5² + 5²) = 5√2 m/s directed NW. Average acceleration = 5√2/10 = 1/√2 m/s² towards north-west."
      },
      {
        q: "All the graphs below are intended to represent the same motion. One of them does it incorrectly. The incorrect graph is:",
        options: [
          "velocity vs position (straight line up)",
          "distance vs time (straight line up)",
          "position vs time (parabola going up then leveling)",
          "velocity vs time (horizontal line)"
        ],
        ans: 2,
        src: "JEE Main 2018",
        explanation: "For uniform motion (constant velocity), position vs time must be a straight line, not a parabola. A parabolic x-t graph implies changing velocity (acceleration), which contradicts uniform motion."
      },
      {
        q: "For a particle in uniform motion along x-axis, the area under the v-t graph between t₁ and t₂ gives:",
        options: ["Acceleration", "Displacement", "Speed", "Force"],
        ans: 1,
        src: "Concept",
        explanation: "Area under v-t graph = ∫v dt = displacement. This is a fundamental result of kinematics."
      }
    ]
  },

  // ── TOPIC 2 : NON-UNIFORM MOTION ────────────────────────
  {
    id: 'motion-topic2', title: "Non-Uniform Motion", course: "11",
    desc: "JEE PYQ : Variable Acceleration, V-T Graphs, Equations of Motion", count: 8,
    questions: [
      {
        q: "The velocity (v) and time (t) graph of a body in straight line motion is shown. The point S is at 4.333 s. The total distance covered by the body in 6 s is:",
        options: ["37/3 m", "12 m", "11 m", "49/4 m"],
        ans: 0,
        src: "JEE Main 05 Sep 2020 II",
        explanation: "From the v-t graph, compute area for each segment (including the negative portion below t-axis). Total distance = sum of |areas| = 37/3 m."
      },
      {
        q: "A bullet of mass 20 g has initial speed 1 m/s before penetrating a mud wall of thickness 20 cm. The wall offers a mean resistance of 2.5×10⁻² N. Speed of bullet after emerging is close to:",
        options: ["0.1 m/s", "0.7 m/s", "0.3 m/s", "0.4 m/s"],
        ans: 1,
        src: "JEE Main 10 Apr 2019 II",
        explanation: "Using work-energy theorem: ½mv² − ½mu² = −F·d. ½(0.02)v² = ½(0.02)(1)² − (2.5×10⁻²)(0.20) = 0.01 − 0.005 = 0.005. v² = 0.5, v ≈ 0.7 m/s."
      },
      {
        q: "Position of a particle as function of time t: x(t) = at + bt² − ct³, where a, b, c are constants. When particle attains zero acceleration, its velocity is:",
        options: ["a + b²/4c", "a + b²/3c", "a + b²/c", "a + b²/2c"],
        ans: 1,
        src: "JEE Main 9 Apr 2019 II",
        explanation: "v = a + 2bt − 3ct². Acceleration α = 2b − 6ct = 0 ⟹ t = b/3c. Substituting: v = a + 2b(b/3c) − 3c(b/3c)² = a + 2b²/3c − b²/3c = a + b²/3c."
      },
      {
        q: "A particle starts from origin O from rest and moves with uniform acceleration along +x axis. Which figure correctly represents motion qualitatively? (a = accel, v = velocity, x = displacement)",
        options: [
          "(B), (C) — a vs t horizontal; v vs t linear from origin",
          "(A) — a vs t linear increasing",
          "(A), (B), (C)",
          "(A), (B), (D)"
        ],
        ans: 0,
        src: "JEE Main 8 Apr 2019 II",
        explanation: "For uniform acceleration from rest: a = constant (horizontal line); v = at (straight line through origin); x = ½at² (upward parabola through origin). So graphs (B) for a-t and (C) for v-t are correct."
      },
      {
        q: "In a car race on a straight road, car A takes time t less than car B at finish, and passes finishing point with speed v more than car B. Both start from rest with constant accelerations a₁ and a₂. Then v equals:",
        options: ["(2a₁a₂/(a₁+a₂))t", "√(2a₁a₂) · t", "√(a₁a₂) · t", "((a₁+a₂)/2) · t"],
        ans: 2,
        src: "JEE Main 9 Jan 2019 II",
        explanation: "Let car A take time T and car B take T+t. Final speeds: v_A = a₁T, v_B = a₂(T+t). Both cover same distance: ½a₁T² = ½a₂(T+t)². From these conditions: v = v_A − v_B = √(a₁a₂) · t."
      },
      {
        q: "The distance travelled by a body moving along a line in time t is proportional to t³. The acceleration-time (a, t) graph for the motion will be:",
        options: [
          "a decreasing curve (hyperbola-like)",
          "a linearly increasing straight line through origin",
          "a linearly decreasing line",
          "a horizontal line (constant a)"
        ],
        ans: 1,
        src: "JEE Main Online May 12 2012",
        explanation: "x ∝ t³ ⟹ v = dx/dt ∝ t² ⟹ a = dv/dt ∝ t. So a-t graph is a straight line through origin (linearly increasing)."
      },
      {
        q: "The velocity-displacement graph of a particle moving along a straight line shows v decreasing linearly with x from v₀ at x = 0 to 0 at x = x₀. The most suitable acceleration-displacement graph is:",
        options: [
          "a vs x: straight line with negative slope through positive a-axis",
          "a vs x: straight line with negative slope through x-axis (a can be negative)",
          "a vs x: parabola",
          "a vs x: horizontal line"
        ],
        ans: 1,
        src: "JEE 2005S",
        explanation: "v = v₀(1 − x/x₀). Then a = v·dv/dx = v₀(1 − x/x₀)·(−v₀/x₀) = −v₀²/x₀·(1 − x/x₀). This is linear in x with negative slope, starting at a negative value and becoming less negative — a straight line with negative intercept."
      },
      {
        q: "A body starts from rest at t = 0, the acceleration-time graph shows constant acceleration of 10 m/s² from t = 0 to t = 11 s. Maximum velocity attained by the body is:",
        options: ["110 m/s", "55 m/s", "650 m/s", "550 m/s"],
        ans: 0,
        src: "JEE 2004S",
        explanation: "From a-t graph, area = Δv. Maximum v = a × t = 10 × 11 = 110 m/s (since starts from rest)."
      }
    ]
  },

  // ── TOPIC 3 : RELATIVE VELOCITY ─────────────────────────
  {
    id: 'motion-topic3', title: "Relative Velocity in 1D", course: "11",
    desc: "JEE PYQ — trains, escalators, relative motion", count: 5,
    questions: [
      {
        q: "Train A and train B are running on parallel tracks in opposite directions with speeds 36 km/h and 72 km/h respectively. A person is walking in train A opposite to its motion at 1.8 km/h. Speed of this person as observed from train B is close to:",
        options: ["29.5 m/s", "28.5 m/s", "31.5 m/s", "30.5 m/s"],
        ans: 1,
        src: "JEE Main 2 Sep 2020 I",
        explanation: "Speed of train A = 10 m/s, train B = 20 m/s (opposite). Person's speed w.r.t. ground = 10 − 0.5 = 9.5 m/s (in A's direction). Relative speed seen from B = 9.5 + 20 = 29.5 m/s. Wait — person walks opposite to A, so v_person = 10 − 0.5 = 9.5 m/s. Observed from B: 9.5 + 20 = 29.5 m/s. Answer is (a) 29.5 m/s."
      },
      {
        q: "A person standing on open ground hears sound of a jet plane coming from north at 60° with ground level. He finds the plane right above him. If v is speed of sound, speed of the plane is:",
        options: ["(√3/2)v", "2v/√3", "v", "v/2"],
        ans: 0,
        src: "JEE Main 12 Jan 2019 II",
        explanation: "When person hears the sound, plane has moved further. Using geometry of the sound cone: v_plane/v_sound = sin(30°)/sin(90°)... By Mach-cone analysis: v_plane = v·sin(60°) = (√3/2)v."
      },
      {
        q: "A car is standing 200 m behind a bus which is also at rest. Both start moving at the same instant. Bus has acceleration 2 m/s², car has acceleration 4 m/s². Car catches the bus after:",
        options: ["√110 s", "√120 s", "10√2 s", "15 s"],
        ans: 2,
        src: "JEE Main Online April 9 2017",
        explanation: "Relative acceleration = 4 − 2 = 2 m/s². Initial relative displacement = 200 m. Using s = ½at²: 200 = ½(2)t² ⟹ t² = 200 ⟹ t = 10√2 s."
      },
      {
        q: "A person climbs up a stalled escalator in 60 s. If standing on the same escalator running at constant velocity he takes 40 s. Time taken to walk up the moving escalator is:",
        options: ["37 s", "27 s", "24 s", "45 s"],
        ans: 2,
        src: "JEE Main Online April 12 2014",
        explanation: "Let L = length. Speed of person = L/60. Speed of escalator = L/40. Combined speed = L/60 + L/40 = L(2+3)/120 = 5L/120 = L/24. Time = L/(L/24) = 24 s."
      },
      {
        q: "Two identical trains are moving on rails along the equator on the earth in opposite directions with the same speed. They will exert the same pressure on the rails. TRUE or FALSE?",
        options: ["True", "False", "Depends on speed", "Cannot determine"],
        ans: 1,
        src: "JEE 1985",
        explanation: "False. One train moves in Earth's rotation direction (effectively faster), requiring more centripetal force, so it presses harder on the rails. The other moves opposite, pressing less hard. Pressures are NOT equal."
      }
    ]
  },

  // ── TOPIC 4 : MOTION UNDER GRAVITY ──────────────────────
  {
    id: 'motion-topic4', title: "Motion Under Gravity", course: "11",
    desc: "JEE PYQ — free fall, vertical throw, bouncing, towers", count: 7,
    questions: [
      {
        q: "A helicopter rises from rest on the ground vertically upward with constant acceleration g. A food packet is dropped from the helicopter when it is at height h. Time taken by packet to reach the ground is close to: [g is acceleration due to gravity]",
        options: [
          "t = (2/3)√(h/g)",
          "t = 1.8√(h/g)",
          "t = 3.4√(h/g)",
          "t = √(2h/3g)"
        ],
        ans: 2,
        src: "JEE Main 5 Sep 2020 I",

let currentQuiz = null, currentQ = 0, score = 0, answered = false;

function buildSelector() {
  const grid = document.getElementById('selectorGrid');
  grid.innerHTML = QUIZZES.map(q => `
    <button class="sel-card" onclick="startQuiz('${q.id}')">
      <h4>${q.title}</h4>
      <p>${q.desc}</p>
      <div class="sel-count">${q.count} Questions · Class ${q.course}</div>
    </button>
  `).join('');
}

function startQuiz(id) {
  currentQuiz = QUIZZES.find(q => q.id === id);
  currentQ = 0; score = 0;
  document.getElementById('selector').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('quizArea').classList.add('active');
  document.getElementById('quizTitle').textContent = currentQuiz.title + ' Quiz';
  renderQuestion();
}

function renderQuestion() {
  const total = currentQuiz.questions.length;
  const q = currentQuiz.questions[currentQ];
  answered = false;

  document.getElementById('qCounter').textContent = `Q ${currentQ+1} of ${total}`;
  document.getElementById('progressFill').style.width = ((currentQ/total)*100)+'%';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = currentQ < total-1 ? 'Next →' : 'See Results';

  document.getElementById('questionContainer').innerHTML = `
    <div class="question-card">
      <div class="q-num">Question ${currentQ+1}</div>
      ${q.src ? `<div class="q-source">[${q.src}]</div>` : ''}
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectAnswer(${i})" id="opt${i}">
            <span class="option-letter">${String.fromCharCode(65+i)}</span>
            ${opt}
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="explanation">${q.explanation}</div>
    </div>
  `;
}

function selectAnswer(selected) {
  if (answered) return;
  answered = true;
  const q = currentQuiz.questions[currentQ];
  if (selected === q.ans) score++;

  q.options.forEach((_, i) => {
    const btn = document.getElementById('opt'+i);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selected) btn.classList.add('wrong');
  });

  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').disabled = false;
}

function nextQ() {
  currentQ++;
  if (currentQ >= currentQuiz.questions.length) {
    showScore();
  } else {
    renderQuestion();
  }
}

function showScore() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'block';
  const total = currentQuiz.questions.length;
  const pct = Math.round((score/total)*100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTot').textContent = '/ '+total;
  document.getElementById('scoreMsg').textContent =
    pct >= 80 ? 'Excellent! 🎉' : pct >= 60 ? 'Good Work! 👍' : 'Keep Practising! 💪';
  document.getElementById('scoreDetail').textContent =
    `You scored ${score} out of ${total} (${pct}%) in ${currentQuiz.title}.`;
}

function retryQuiz() {
  document.getElementById('scoreArea').style.display = 'none';
  startQuiz(currentQuiz.id);
}

function backToSelector() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('selector').style.display = 'block';
  currentQuiz = null;
}

buildSelector();
</script>
