    .page-title{font-family:var(--serif);font-size:clamp(2.2rem,4vw,3.5rem);letter-spacing:-0.02em;}
    .page-sub{font-size:0.95rem;color:var(--muted);margin-top:0.6rem;}

    .options{display:flex;flex-direction:column;gap:0.75rem;}
    .option-btn{background:var(--white);border:1.5px solid var(--border);border-radius:4px;padding:1rem 1.2rem;text-align:left;font-family:var(--sans);font-size:0.9rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.8rem;}

    .option-btn.correct .option-letter{background:var(--green);color:white;border-color:var(--green);}
    .option-btn.wrong .option-letter{background:var(--red);color:white;border-color:var(--red);}

    .quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;max-width:780px;}
    .btn-nav{padding:0.75rem 1.8rem;border-radius:3px;font-family:var(--sans);font-size:0.875rem;font-weight:600;cursor:pointer;transition:all 0.2s;}

    .btn-back{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
    .btn-back:hover{border-color:var(--accent);color:var(--accent);}
    .score-screen{display:none;text-align:center;padding:4rem 2rem;max-width:500px;margin:0 auto;}
    .score-screen.show{display:block;}
    .score-circle{width:120px;height:120px;border-radius:50%;background:var(--cream);border:3px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 2rem;}
    .score-num{font-family:var(--serif);font-size:2.5rem;color:var(--accent);}

    @media(max-width:900px){nav{padding:1rem 1.5rem;}.nav-links{display:none;}.page-header,.quiz-selector,.quiz-area{padding-left:1.5rem;padding-right:1.5rem;}}

<script>
const QUIZZES = [

  {
    id: 'kinematics', title: "Kinematics Basics", course: "11",
    desc: "1D & 2D motion, graphs, projectile", count: 5,
    questions: [
      { q: "A ball is thrown vertically upward with velocity 20 m/s. How high does it go? (g = 10 m/s²)", options: ["10 m","20 m","40 m","5 m"], ans: 1, src: "", explanation: "Using v² = u² - 2gh, at max height v=0. h = u²/2g = 400/20 = 20 m." },
      { q: "The slope of a velocity-time graph gives:", options: ["Displacement","Speed","Acceleration","Distance"], ans: 2, src: "", explanation: "Slope of v-t graph = Δv/Δt = acceleration." },
      { q: "A projectile is launched at 45° for maximum range. If initial speed is u, range R is:", options: ["u²/g","u²/2g","2u²/g","u/g"], ans: 0, src: "", explanation: "R = u²sin(2θ)/g. At θ=45°, sin90°=1. So R = u²/g." },
      { q: "An object moves 4 m East and 3 m North. Its displacement magnitude is:", options: ["7 m","1 m","5 m","12 m"], ans: 2, src: "", explanation: "Displacement = √(4² + 3²) = √25 = 5 m." },
      { q: "If a car decelerates from 20 m/s to rest in 4 seconds, the retardation is:", options: ["80 m/s²","5 m/s²","4 m/s²","10 m/s²"], ans: 1, src: "", explanation: "a = (v-u)/t = (0-20)/4 = -5 m/s². Retardation = 5 m/s²." }
    ]
  },

  {
    id: 'motion-topic1', title: "Distance, Displacement & Uniform Motion", course: "11",
    desc: "JEE PYQ: Uniform Motion, Displacement, Average Velocity", count: 6,
    questions: [
      { q: "A particle is moving with speed v = b√x along the positive x-axis. The speed of the particle at time t = τ (particle is at origin at t = 0) is:", options: ["b²τ / 4","b²τ / 2","b²τ","b²τ / √2"], ans: 1, src: "JEE Main 12 Apr 2019 II", explanation: "v = b√x => dx/√x = b dt. Integrating: 2√x = bt => x = b²t²/4. Then v = dx/dt = b²t/2. At t = τ, v = b²τ/2." },
      { q: "In 1.0 s, a particle goes from point A to point B moving in a semicircle of radius 1.0 m. The magnitude of the average velocity is:", options: ["3.14 m/s","2.0 m/s","1.0 m/s","Zero"], ans: 1, src: "JEE 1999S", explanation: "Displacement = diameter = 2r = 2.0 m. Time = 1.0 s. Average velocity = 2.0/1.0 = 2.0 m/s." },
      { q: "A particle moves in a circle of radius R. In half the period of revolution, its displacement is ___ and distance covered is ___.", options: ["2R, πR","πR, 2R","R, 2πR","2πR, R"], ans: 0, src: "JEE 1983", explanation: "In half revolution, displacement = diameter = 2R. Distance = half circumference = πR." },
      { q: "A particle is moving eastwards with velocity 5 m/s. In 10 s the velocity changes to 5 m/s northwards. The average acceleration in this time is:", options: ["Zero","1/√2 m/s² towards north-west","1/√2 m/s² towards north-east","1/√2 m/s² towards north"], ans: 1, src: "JEE 1982", explanation: "Δv = 5N - 5E. Magnitude = 5√2 m/s directed NW. Average acceleration = 5√2/10 = 1/√2 m/s² towards north-west." },
      { q: "All the graphs below are intended to represent the same uniform motion. One of them does it incorrectly. The incorrect graph is the one showing:", options: ["velocity vs position: straight line","distance vs time: straight line","position vs time: parabola (curved)","velocity vs time: horizontal line"], ans: 2, src: "JEE Main 2018", explanation: "For uniform motion, position vs time must be a straight line, not a parabola. A parabolic x-t graph implies acceleration, contradicting uniform motion." },
      { q: "For a particle in uniform motion along x-axis, the area under the v-t graph between t₁ and t₂ gives:", options: ["Acceleration","Displacement","Speed","Force"], ans: 1, src: "Concept", explanation: "Area under v-t graph = ∫v dt = displacement." }
    ]
  },

  {
    id: 'motion-topic2', title: "Non-Uniform Motion", course: "11",
    desc: "JEE PYQ: Variable Acceleration, V-T Graphs, Equations of Motion", count: 8,
    questions: [
      { q: "The velocity (v) and time (t) graph of a body shows point S at 4.333 s. The total distance covered by the body in 6 s is:", options: ["37/3 m","12 m","11 m","49/4 m"], ans: 0, src: "JEE Main 05 Sep 2020 II", explanation: "Compute |area| of each segment in v-t graph (including portions below t-axis). Total distance = 37/3 m." },
      { q: "A bullet of mass 20 g has initial speed 1 m/s before penetrating a mud wall of thickness 20 cm. The wall offers mean resistance 2.5×10⁻² N. Speed of bullet after emerging is close to:", options: ["0.1 m/s","0.7 m/s","0.3 m/s","0.4 m/s"], ans: 1, src: "JEE Main 10 Apr 2019 II", explanation: "Work-energy theorem: ½mv² = ½mu² - F·d = 0.01 - 0.005 = 0.005. v² = 0.5, v ≈ 0.7 m/s." },
      { q: "Position of a particle: x(t) = at + bt² - ct³. When particle attains zero acceleration, its velocity is:", options: ["a + b²/4c","a + b²/3c","a + b²/c","a + b²/2c"], ans: 1, src: "JEE Main 9 Apr 2019 II", explanation: "Acceleration = 2b - 6ct = 0 => t = b/3c. Substituting: v = a + 2b(b/3c) - 3c(b/3c)² = a + b²/3c." },
      { q: "A particle starts from origin from rest with uniform acceleration along +x axis. Which graphs are correct? (a=accel, v=velocity, x=displacement, t=time)", options: ["(B) a-t horizontal line AND (C) v-t linear from origin","(A) a-t linearly increasing","(A), (B), (C) all","(A), (B), (D) all"], ans: 0, src: "JEE Main 8 Apr 2019 II", explanation: "Uniform acceleration: a = constant (horizontal line); v = at (straight line from origin). So (B) for a-t and (C) for v-t are correct." },
      { q: "In a car race, car A takes time t less than car B at finish, with speed v more than car B. Both start from rest with accelerations a₁ and a₂. Then v equals:", options: ["(2a₁a₂/(a₁+a₂))t","√(2a₁a₂) · t","√(a₁a₂) · t","((a₁+a₂)/2) · t"], ans: 2, src: "JEE Main 9 Jan 2019 II", explanation: "Using equal distance condition for both cars and time difference t: v = √(a₁a₂) · t." },
      { q: "Distance travelled by a body is proportional to t³. The acceleration-time (a-t) graph for the motion will be:", options: ["Hyperbola-like decreasing curve","Linearly increasing straight line through origin","Linearly decreasing line","Horizontal line (constant a)"], ans: 1, src: "JEE Main Online May 12 2012", explanation: "x ∝ t³ => v ∝ t² => a ∝ t. So a-t graph is a straight line through origin." },
      { q: "Velocity-displacement graph shows v decreasing linearly with x from v₀ at x=0 to 0 at x=x₀. The most suitable acceleration-displacement graph is:", options: ["a-x: line with negative slope, starts from positive a","a-x: line with negative slope, starts from negative a (a is always negative)","a-x: parabola","a-x: horizontal line"], ans: 1, src: "JEE 2005S", explanation: "v = v₀(1 - x/x₀). a = v·dv/dx = -v₀²/x₀ · (1 - x/x₀). This is linear in x, always negative, with negative intercept at x=0." },
      { q: "A body starts from rest at t=0 with constant acceleration 10 m/s² for 11 s. Maximum velocity attained is:", options: ["110 m/s","55 m/s","650 m/s","550 m/s"], ans: 0, src: "JEE 2004S", explanation: "v = u + at = 0 + 10×11 = 110 m/s." }
    ]
  },

  {
    id: 'motion-topic3', title: "Relative Velocity in 1D", course: "11",
    desc: "JEE PYQ: Trains, Escalators, Relative Motion", count: 5,
    questions: [
      { q: "Train A and train B run on parallel tracks in opposite directions at 36 km/h and 72 km/h. A person in train A walks opposite to its motion at 1.8 km/h. Speed of the person as observed from train B is close to:", options: ["29.5 m/s","28.5 m/s","31.5 m/s","30.5 m/s"], ans: 0, src: "JEE Main 2 Sep 2020 I", explanation: "Train A = 10 m/s, Train B = 20 m/s (opposite). Person's ground speed = 10 - 0.5 = 9.5 m/s. Observed from B: 9.5 + 20 = 29.5 m/s." },
      { q: "A person on open ground hears sound of a jet coming from north at 60° with ground. He finds the plane right above him. If v is speed of sound, speed of the plane is:", options: ["(√3/2)v","2v/√3","v","v/2"], ans: 0, src: "JEE Main 12 Jan 2019 II", explanation: "By Mach-cone geometry: v_plane = v·sin(60°) = (√3/2)v." },
      { q: "A car is 200 m behind a bus, both at rest. Both start together. Bus: a = 2 m/s², car: a = 4 m/s². Car catches bus after:", options: ["√110 s","√120 s","10√2 s","15 s"], ans: 2, src: "JEE Main Online April 9 2017", explanation: "Relative acceleration = 2 m/s². 200 = ½(2)t² => t² = 200 => t = 10√2 s." },
      { q: "A person climbs a stalled escalator in 60 s. Standing on running escalator takes 40 s. Time to walk up the moving escalator:", options: ["37 s","27 s","24 s","45 s"], ans: 2, src: "JEE Main Online April 12 2014", explanation: "Speed of person = L/60, escalator = L/40. Combined = L/60 + L/40 = L/24. Time = 24 s." },
      { q: "Two identical trains move on rails along equator in opposite directions at same speed. They will exert same pressure on rails. TRUE or FALSE?", options: ["True","False","Depends on speed","Cannot determine"], ans: 1, src: "JEE 1985", explanation: "False. One train moves with Earth's rotation (effectively faster, needs more centripetal force, presses harder). Pressures are NOT equal." }
    ]
  },

  {
    id: 'motion-topic4', title: "Motion Under Gravity", course: "11",
    desc: "JEE PYQ: Free Fall, Vertical Throw, Bouncing, Towers", count: 7,
    questions: [
      { q: "A helicopter rises from rest with constant acceleration g. A food packet is dropped when helicopter is at height h. Time taken by packet to reach ground is close to:", options: ["t = (2/3)√(h/g)","t = 1.8√(h/g)","t = 3.4√(h/g)","t = √(2h/3g)"], ans: 2, src: "JEE Main 5 Sep 2020 I", explanation: "Packet is dropped with upward velocity v = √(2gh). Solving -h = v·t - ½gt² gives t ≈ 3.4√(h/g)." },
      { q: "A tennis ball released from height h rebounds from floor to height h/2. The velocity-versus-height graph is best represented by:", options: ["V-shape with single peak","Two separate √-shaped curves: one going down (h to 0), one going up (0 to h/2)","Linear decrease then increase","Horizontal line"], ans: 1, src: "JEE Main 4 Sep 2020 I", explanation: "Falling: v = √(2g(h-y)) - sqrt curve. Rising: v = √(2gy) - sqrt curve. Two separate curves due to energy loss at floor." },
      { q: "A body is thrown vertically upwards. Which graph correctly represents velocity vs time?", options: ["Line starting negative, going positive","Straight line starting positive, passing through zero, going negative","Symmetric triangle shape","Line from positive to zero only"], ans: 1, src: "JEE Main 2017", explanation: "Initial v is positive (upward), decreases at constant rate g, passes through zero at top, becomes negative (downward). Straight line with negative slope." },
      { q: "Two stones thrown up from 240 m cliff with speeds 10 m/s and 40 m/s simultaneously. Graph of relative position of 2nd w.r.t. 1st vs time:", options: ["Linear increase throughout","Linear increase, then slope changes when 1st stone hits ground","Decreases throughout","Constant then drops"], ans: 1, src: "JEE Main 2015", explanation: "Relative velocity = 30 m/s (constant, since both have same g). Linear increase until 1st stone lands; then slope changes." },
      { q: "From tower of height H, particle thrown up with speed u. Total time to hit ground = n × time to reach highest point. Relation between H, u, n:", options: ["2gH = n²u²","gH = (n-2)²u²","2gH = nu²(n-2)","gH = (n-2)u²"], ans: 2, src: "JEE Main 2014", explanation: "t_top = u/g. T = nu/g. Using -H = uT - ½gT²: 2gH = nu²(n-2)." },
      { q: "Ball dropped from 100 m tower on a planet. In last ½ s covers 19 m. Acceleration due to gravity (m/s²) on that planet is:", options: ["8.00","5.00","10.0","12.0"], ans: 0, src: "JEE Main 8 Jan 2020 II", explanation: "From ½gT² = 100 and distance in last ½s = 19 m, solving simultaneously gives g = 8 m/s²." },
      { q: "Two balls of different masses thrown vertically upward with same speed return to projection point with same speed (neglect air resistance). This is:", options: ["True","False","True only for equal masses","Depends on height"], ans: 0, src: "JEE 1983", explanation: "True. By energy conservation, any object returns with same speed u regardless of mass. mgh = ½mv² — mass cancels." }
    ]
  },

  {
    id: 'vectors', title: "Vectors & Motion in a Plane", course: "11",
    desc: "JEE PYQ: Vector Algebra, Dot Product, Projectile in 2D", count: 6,
    questions: [
      { q: "Let |A₁| = 3, |A₂| = 5 and |A₁ + A₂| = 5. The value of (2A₁ + 3A₂)·(3A₁ - 2A₂) is:", options: ["-106.5","-99.5","-112.5","-118.5"], ans: 3, src: "JEE Main 8 Apr 2019 II", explanation: "From |A₁+A₂|² = |A₁|² + |A₂|² + 2A₁·A₂: 25 = 9 + 25 + 2A₁·A₂ => A₁·A₂ = -4.5. Then (2A₁+3A₂)·(3A₁-2A₂) = 6|A₁|² - 4A₁·A₂ + 9A₁·A₂ - 6|A₂|² = 6(9) + 5(-4.5) - 6(25) = 54 - 22.5 - 150 = -118.5." },
      { q: "Three vectors P⃗, Q⃗ and R⃗ are shown in the figure. Let S⃗ be any point on the vector R⃗. The distance between the points P and S is b|R⃗|. The general relation among vectors P⃗, Q⃗ and S⃗ is:", image: "images/vector_q5.png", options: [ "S⃗ = (1−b)P⃗ + bQ⃗", "S⃗ = (b−1)P⃗ + bQ⃗", "S⃗ = (1−b²)P⃗ + bQ⃗", "S⃗ = (1−b)P⃗ + b²Q⃗"] },
      { q: "Two vectors A and B have equal magnitudes. Magnitude of (A+B) is n times magnitude of (A-B). The angle between A and B is:", options: ["cos⁻¹[(n²-1)/(n²+1)]","cos⁻¹[(n-1)/(n+1)]","sin⁻¹[(n²-1)/(n²+1)]","sin⁻¹[(n-1)/(n+1)]"], ans: 0, src: "JEE Main 10 Jan 2019 II", explanation: "|A+B|² = 2A²(1+cosθ), |A-B|² = 2A²(1-cosθ). Setting ratio = n²: cosθ = (n²-1)/(n²+1)." },

      { q: "A projectile is given an initial velocity of (î + 2ĵ) m/s, where î is horizontal and ĵ is vertical. If g = 10 m/s², the equation of trajectory is:", options: ["y = 2x - 5x²","y = x - 5x²","y = 2x + 5x²","y = x + 5x²"], ans: 0, src: "JEE Main 2013", explanation: "x = t, y = 2t - 5t². Eliminating t: y = 2x - 5x²." },

let currentQuiz = null, currentQ = 0, score = 0, answered = false;

function buildSelector() {
  const grid = document.getElementById('selectorGrid');
  grid.innerHTML = QUIZZES.map(q => `
    <button class="sel-card" onclick="startQuiz('${q.id}')">
      <h4>${q.title}</h4>
      <p>${q.desc}</p>
      <div class="sel-count">${q.questions.length} Questions &middot; Class ${q.course}</div>
    </button>
  `).join('');
}

function startQuiz(id) {
  currentQuiz = QUIZZES.find(q => q.id === id);
  currentQ = 0; score = 0;
  document.getElementById('selector').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('quizArea').classList.add('active');
  document.getElementById('quizTitle').textContent = currentQuiz.title + ' Quiz';
  renderQuestion();
}

function renderQuestion() {
  const total = currentQuiz.questions.length;
  const q = currentQuiz.questions[currentQ];
  answered = false;
  document.getElementById('qCounter').textContent = 'Q ' + (currentQ+1) + ' of ' + total;
  document.getElementById('progressFill').style.width = ((currentQ/total)*100)+'%';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = currentQ < total-1 ? 'Next →' : 'See Results';
  document.getElementById('questionContainer').innerHTML =
    '<div class="question-card">' +
      '<div class="q-num">Question ' + (currentQ+1) + '</div>' +
      (q.src ? '<div class="q-source">[' + q.src + ']</div>' : '') +
      '<div class="q-text">' + q.q + '</div>' +
      '<div class="options">' +
        q.options.map(function(opt, i) {
          return '<button class="option-btn" onclick="selectAnswer(' + i + ')" id="opt' + i + '">' +
            '<span class="option-letter">' + String.fromCharCode(65+i) + '</span>' + opt +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="explanation" id="explanation">' + q.explanation + '</div>' +
    '</div>';
}

function selectAnswer(selected) {
  if (answered) return;
  answered = true;
  var q = currentQuiz.questions[currentQ];
  if (selected === q.ans) score++;
  q.options.forEach(function(_, i) {
    var btn = document.getElementById('opt'+i);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selected) btn.classList.add('wrong');
  });
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').disabled = false;
}

function nextQ() {
  currentQ++;
  if (currentQ >= currentQuiz.questions.length) showScore();
  else renderQuestion();
}

function showScore() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'block';
  var total = currentQuiz.questions.length;
  var pct = Math.round((score/total)*100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTot').textContent = '/ '+total;
  document.getElementById('scoreMsg').textContent = pct >= 80 ? 'Excellent! 🎉' : pct >= 60 ? 'Good Work! 👍' : 'Keep Practising! 💪';
  document.getElementById('scoreDetail').textContent = 'You scored ' + score + ' out of ' + total + ' (' + pct + '%) in ' + currentQuiz.title + '.';
}

function retryQuiz() {
  document.getElementById('scoreArea').style.display = 'none';
  startQuiz(currentQuiz.id);
}

function backToSelector() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('selector').style.display = 'block';
  currentQuiz = null;
}

buildSelector();
</script>
